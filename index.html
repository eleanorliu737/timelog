<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="时间日志">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>时间日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one-screen app. Sticky header (title, 3 tabs, period nav); views: week grid, daily check-in, summary report; bottom sheet for editing. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1B232E; --muted:#667283; --line:#D3DAE2; --accent:#1F5F7A; --accent-ink:#FFFFFF;
  --warn:#B4532A; --warn-bg:#FBEDE5; --ok:#23866A; --mix:17%; --today:#E3EBF2;
  --c-sleep:#6E74A6; --c-meditate:#7FA05A; --c-reply:#3F97CF; --c-write:#8E5BB8; --c-hobby:#D9A12E;
  --c-study:#2F62C8; --c-work:#23866A; --c-read:#9A6A2E; --c-sport:#2A9AA0; --c-meal:#C9774A;
  --c-commute:#8C93A0; --c-social:#C2508C; --c-phone:#D2483E; --c-chores:#8C7B6A; --c-other:#A9B0B9;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-disp:"Noto Serif SC","Songti SC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --ink:#E5E9EF; --muted:#8B96A6; --line:#2A333F; --accent:#6FB3CF; --accent-ink:#0E1A20;
  --warn:#F0956A; --warn-bg:#2E1E17; --ok:#4FC39C; --mix:30%; --today:#1E2833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --ink:#E5E9EF; --muted:#8B96A6; --line:#2A333F; --accent:#6FB3CF; --accent-ink:#0E1A20;
  --warn:#F0956A; --warn-bg:#2E1E17; --ok:#4FC39C; --mix:30%; --today:#1E2833; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--f-disp);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:30px;border-radius:8px;font-size:16px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px}
.sync{font-size:11px;color:var(--muted);border:0;background:none;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
main{flex:1;min-height:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.banner button{border:1px solid currentColor;background:none;color:inherit;border-radius:7px;padding:4px 10px;font-size:12px;white-space:nowrap}
/* grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:360px;table-layout:fixed}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.grid tr>*:last-child{border-right:0}
.grid thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:500;font-size:11px;padding:5px 2px;color:var(--muted)}
.grid thead th button{border:0;background:none;padding:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;color:inherit}
.grid thead th .d{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.grid thead th .w{font-size:10px;font-family:var(--f-mono)}
.grid thead th .pips{display:flex;gap:2px;margin-top:2px}
.grid thead th .pips i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.grid thead th .pips i.on{background:var(--accent)}
.grid thead th.today{background:var(--today)}
.grid thead th.today .d{color:var(--accent);font-weight:500}
.grid col.hc{width:38px}
.grid td.h{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;vertical-align:top;padding-top:4px;font-variant-numeric:tabular-nums}
.grid tr.split td{border-top:2px solid var(--line)}
.cell{display:block;width:100%;height:40px;border:0;background:none;padding:3px;text-align:left;font-size:11px;line-height:1.25;overflow:hidden;position:relative}
.cell span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.cell.f{background:color-mix(in srgb,var(--cc) var(--mix),var(--surface));box-shadow:inset 3px 0 0 var(--cc)}
.cell.auto::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--cc)}
td.today-col{background:var(--today)}
.cell.now{outline:2px solid var(--accent);outline-offset:-2px}
.cell.missed{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--warn) 10%,transparent) 5px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:86%;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgb(0 0 0 / .18)}
.sheet h2{margin:0;font-size:15px;font-weight:500;font-family:var(--f-mono)}
.sheet .sub{font-size:12px;color:var(--muted)}
.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 20%,var(--surface))}
.quick .chip{font-size:12px;padding:4px 10px}
.lab{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:-6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dur{display:flex;align-items:center;gap:8px;font-size:13px}
.actions{display:flex;gap:8px}
.actions button{flex:1;border-radius:10px;padding:11px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.actions .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
/* check-in */
.wrapc{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.card h3 .score{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.item .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.item .nm b{font-weight:500;font-size:14px}
.item .nm span{font-size:11px;color:var(--muted)}
.item .tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--bg);color:var(--muted)}
.item .info{grid-column:2;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item input{grid-column:2;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;padding:3px 0;width:100%}
.item input::placeholder{color:var(--muted);opacity:.7}
.wakebox{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wakebox input{width:auto;font-family:var(--f-mono)}
.prog{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.prog i{aspect-ratio:1;max-width:100%;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.prog i.p{border-color:transparent}
.prog i.cur{outline:2px solid var(--accent);outline-offset:1px}
/* summary */
.sum{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .d{font-size:11px;color:var(--muted);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:64px 1fr 74px;align-items:center;gap:8px;font-size:12px}
.bar .t{height:12px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar .t b{display:block;height:100%;background:var(--cc);border-radius:3px}
.bar .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bg)}
.stack b{height:100%;background:var(--cc)}
.part{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;font-size:12px}
.part .top3{grid-column:2;font-size:11px;color:var(--muted);margin-top:-3px}
.parts{display:flex;flex-direction:column;gap:10px}
.mx{overflow-x:auto}
.mxg{display:grid;gap:3px;align-items:center;min-width:0}
.mxg .rl{font-size:11px;white-space:nowrap;padding-right:6px}
.mxg .cl{font-family:var(--f-mono);font-size:9px;color:var(--muted);text-align:center}
.mxg i{aspect-ratio:1;max-width:100%;border-radius:2px;background:var(--bg)}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.demo-tag{display:inline-block;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px}
.tools{display:flex;flex-direction:column;gap:8px}
.tools textarea{min-height:90px;font-family:var(--f-mono);font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:380px){.tabs button{padding:5px 9px}h1{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head><body>
<div class="app">
  <header>
    <div class="top">
      <h1>时间日志</h1>
      <div class="tabs" role="tablist">
        <button id="tabLog" role="tab" aria-selected="true">记录</button>
        <button id="tabChk" role="tab" aria-selected="false">打卡</button>
        <button id="tabSum" role="tab" aria-selected="false">总结</button>
      </div>
    </div>
    <div class="nav">
      <button class="iconbtn" id="prev" aria-label="上一段">‹</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0">
        <span class="lbl" id="rangeLbl"></span>
        <button class="sync" id="sync" aria-label="GitHub 同步设置">本机保存</button>
      </div>
      <div class="row" style="gap:6px;flex-wrap:nowrap">
        <button class="ghost" id="todayBtn">今天</button>
        <button class="iconbtn" id="next" aria-label="下一段">›</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="sheetRoot"></div>

<script>
(function(){
/* Order matters: the first category whose keyword matches wins. */
const CATS=[
 {id:"sleep",n:"睡觉",k:["睡","sleep","nap","躺"]},
 {id:"meditate",n:"静坐",k:["静坐","冥想","meditat","正念","呼吸"]},
 {id:"reply",n:"回信",k:["回信","回消息","回邮件","回复","reply"]},
 {id:"write",n:"写作",k:["写作","写文","公众号","日记","writing","文章","博客","journal"]},
 {id:"hobby",n:"爱好",k:["爱好","画画","画","琴","吉他","手工","摄影","书法","烘焙","拼图","园艺","hobby","乐器","钩织","唱"]},
 {id:"study",n:"学习",k:["学","课","复习","刷题","背","论文","aws","azure","course","study","leetcode","coding","代码","项目","编程","德语","german","ml","nlp","作品集"]},
 {id:"work",n:"工作",k:["上班","工作","班","host","餐厅","shift","面试","简历","求职","work","job","外贸","客户","邮件"]},
 {id:"read",n:"阅读",k:["读","阅读","看书","书","read","kindle","book"]},
 {id:"sport",n:"运动",k:["跑","健身","瑜伽","散步","运动","gym","walk","run","yoga","游泳"]},
 {id:"meal",n:"吃饭",k:["吃","饭","早餐","午餐","晚餐","做饭","cook","lunch","dinner","breakfast","咖啡"]},
 {id:"commute",n:"路上",k:["通勤","公交","开车","练车","bus","dart","luas","路上","驾","drive"]},
 {id:"social",n:"社交",k:["朋友","聊天","约会","电话","家人","视频","聚","party","call","见面"]},
 {id:"phone",n:"刷手机",k:["instagram","ins","小红书","抖音","tiktok","youtube","b站","刷","netflix","剧","游戏","微博","reddit","手机","x.com","twitter"]},
 {id:"chores",n:"杂事",k:["洗","打扫","家务","购物","超市","收拾","整理","办事"]},
 {id:"other",n:"其他",k:[]}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
/* 曾国藩八格: each maps to one hourly category */
const ZENG=[
 {id:"read",n:"读书",d:"阅读",cat:"read"},
 {id:"work",n:"办公",d:"工作",cat:"work"},
 {id:"meditate",n:"静坐",d:"冥想",cat:"meditate"},
 {id:"study",n:"课子",d:"学习",cat:"study"},
 {id:"social",n:"对客",d:"社交",cat:"social"},
 {id:"reply",n:"回信",d:"有质量地回消息",cat:"reply"},
 {id:"write",n:"属文",d:"写作",cat:"write"},
 {id:"hobby",n:"乐在",d:"爱好 / 休闲",cat:"hobby"}
];
/* 50 天挑战 */
const C50=[
 {id:"wake",n:"8:30 前起床",d:"看起床时间",cc:"sleep"},
 {id:"morning",n:"晨间 1 小时无手机",d:"中午前的乐在、静坐、阅读或写作",cc:"hobby"},
 {id:"sport",n:"运动 1 小时",d:"运动格",cc:"sport"},
 {id:"skill",n:"新技能 1 小时",d:"学习格（课子）",cc:"study"},
 {id:"read",n:"阅读 10 页",d:"阅读格，或晚上手动勾",cc:"read"},
 {id:"fast",n:"16+8 饮食",d:"晚上手动确认",cc:"meal"},
 {id:"log",n:"记录全过程",d:"当天填满 16 小时以上",cc:"other"}
];
const HOURS=[];for(let h=6;h<=25;h++)HOURS.push(h);
const hl=h=>String(h%24).padStart(2,"0");
const WD="日一二三四五六";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function guess(t){t=(t||"").toLowerCase();for(const c of CATS){if(c.k.some(k=>t.includes(k)))return c.id}return "other"}
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtT=v=>Math.floor(v)%24+":"+pad(Math.round((v%1)*60)%60);
const md=k=>{const d=parse(k);return `${d.getMonth()+1}/${d.getDate()}`};
/* 0–2am belongs to the previous day as slot 24/25 */
function logicalNow(){const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),n.getDate());let h=n.getHours();if(h<2){d=addDays(d,-1);h+=24}return{date:key(d),h,raw:n}}

/* ---------- state + local storage ---------- */
const LS="timelog.v1";
const state={days:{},anchor:null,c50Start:null,su:0,view:"log",weekStart:null,checkDate:null,sumForm:"time",sumMode:"week",sumRef:null,demo:false};
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");state.days=o.days||{};state.anchor=o.anchor||null;state.c50Start=o.c50Start||null;state.su=o.su||0}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({days:state.days,anchor:state.anchor,c50Start:state.c50Start,su:state.su}))}catch(e){}}

/* ---------- GitHub sync: one JSON file in a private repo ---------- */
const GH={owner:"eleanorliu737",repo:"timelog-data",path:"data.json"};
const TK="timelog.ghtoken";
let ghToken=null,ghSha=null,ghTimer=null,ghBusy=false,ghDirty=false;
try{ghToken=localStorage.getItem(TK)}catch(e){}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function setSync(t){$("#sync").textContent=t}
function ghUrl(){return `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`}
function ghHeaders(){return{"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function mergeIn(remote){
  if(!remote)return false;let changed=false;
  if((remote.su||0)>(state.su||0)||(!state.su&&remote.anchor)){

  const n=cols.length;const showCol=i=>n<=14||i===0||(i+1)%5===0;
  let h=`<div class="mx"><div class="mxg" style="grid-template-columns:auto repeat(${n},minmax(6px,1fr));min-width:${n>14?320:0}px"><span></span>${cols.map((c,i)=>`<span class="cl">${showCol(i)?c:""}</span>`).join("")}`;
  for(const r of rows){h+=`<span class="rl">${r.n}</span>`+r.vals.map((v,i)=>`<i style="background:${v==null?"var(--bg)":`color-mix(in srgb,var(--c-${r.cc}) ${Math.round(15+v*85)}%,var(--bg))`};${v?"":"opacity:.8"}" title="${r.n} ${cols[i]} ${v==null?"无":Math.round(v*100)+"%"}"></i>`).join("")}
  return h+`</div></div>`}
function kpi(k,v,d){return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`}

function renderSum(){
  const ks=rangeDays();const today=logicalNow().date;
  const lbl=state.sumMode==="week"?`${md(ks[0])} – ${md(ks[6])}`:state.sumMode==="month"?`${parse(ks[0]).getFullYear()} 年 ${parse(ks[0]).getMonth()+1} 月`:`${parse(ks[0]).getFullYear()} 年`;
  $("#rangeLbl").textContent=lbl;
  const src=state.demo?demoData(ks.filter(k=>k<=today||state.sumMode==="week")):state.days;
  const elapsedKs=ks.filter(k=>k<=today);const el=elapsedKs.length||ks.length;
  const ctrl=`<div class="seg"><div class="tabs">${[["time","时间"],["zeng","八格"],["c50","50 天"]].map(([v,n])=>`<button data-form="${v}" aria-selected="${state.sumForm===v}">${n}</button>`).join("")}</div>
    <div class="tabs">${[["week","周"],["month","月"],["year","年"]].map(([v,n])=>`<button data-mode="${v}" aria-selected="${state.sumMode===v}">${n}</button>`).join("")}</div></div>
    ${state.demo?`<div class="row"><span class="demo-tag">示例数据，不是你的记录</span><button class="ghost" id="demoOff">退出示例</button></div>`:""}`;
  const any=ks.some(k=>filledCount(k,src)||(src[k]&&(src[k].zeng||src[k].c50)));
  let body;
  if(!any)body=`<div class="card empty"><div>这段时间还没有记录。<br>在“记录”页点任意格子开始填。</div><button class="ghost" id="demoOn">先看看示例总结</button></div>`;
  else body=state.sumForm==="time"?sumTime(ks,src,el,today):state.sumForm==="zeng"?sumZeng(ks,src,el,today):sumC50(ks,src,el,today);
  $("#main").innerHTML=`<div class="sum">${ctrl}${body}</div>`;bindSum();
}
function sumTime(ks,src,el,today){
  const cnt={};CATS.forEach(c=>cnt[c.id]=0);let filled=0;
  const parts=[["早上",6,12],["下午",12,18],["晚上",18,24],["深夜",24,26]].map(([n,a,b])=>({n,a,b,c:{},t:{}}));
  for(const k of ks){const cs=(src[k]&&src[k].cells)||{};
    for(const h of HOURS){const c=cs[h];if(!c)continue;filled++;cnt[c.c]=(cnt[c.c]||0)+1;const p=parts.find(p=>h>=p.a&&h<p.b);p.c[c.c]=(p.c[c.c]||0)+1;p.t[c.t]=(p.t[c.t]||0)+1}}
  const bk=buckets(ks);const yr=state.sumMode==="year";
  const wakePts=bk.map(b=>{const ws=b.keys.map(k=>wakeOf(k,src)).filter(v=>v!=null);return{label:b.label,v:ws.length?ws.reduce((a,c)=>a+c,0)/ws.length:null}});
  const swPts=bk.map(b=>{const live=b.keys.filter(k=>k<=today||state.demo);const tot=live.reduce((a,k)=>a+hoursOf(k,["study","work"],src).length,0);return{label:b.label,v:yr?(live.length?+(tot/live.length).toFixed(1):0):tot}});
  const wakes=ks.map(k=>wakeOf(k,src)).filter(v=>v!=null);const avgW=wakes.length?wakes.reduce((a,b)=>a+b,0)/wakes.length:null;
  const sw=cnt.study+cnt.work;const max=Math.max(...CATS.map(c=>cnt[c.id]),1);
  return `<div class="kpis">
   ${kpi("学习 + 工作",`${sw}<small> h</small>`,`学习 ${cnt.study} · 工作 ${cnt.work} · 日均 ${(sw/el).toFixed(1)}`)}
   ${kpi("阅读",`${cnt.read}<small> h</small>`,`日均 ${(cnt.read/el).toFixed(1)} h`)}
   ${kpi("平均起床",avgW!=null?fmtT(avgW):"—",`${wakes.length} 天有数据`)}
   ${kpi("刷手机",`${cnt.phone}<small> h</small>`,`记录覆盖 ${Math.round(filled/(el*20)*100)}%`)}</div>
  <div class="card"><h3><span>早起曲线 <small>${yr?"每月平均 · ":""}越高越早</small></span></h3>${lineChart(wakePts,{lo:5,hi:12,lbl:v=>v+":00",aria:"起床时间曲线"})}</div>
  <div class="card"><h3><span>学习 + 工作 <small>${yr?"每月日均小时":"每日小时"}</small></span></h3>${barChart(swPts,{color:"var(--c-study)",fmt:v=>v,aria:"学习加工作小时"})}</div>
  <div class="card"><h3><span>一天的节奏 <small>各时段在做什么</small></span></h3><div class="parts">${parts.map(p=>{const tot=Object.values(p.c).reduce((a,b)=>a+b,0);
    const top=Object.entries(p.t).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>`${esc(t)} ${n}h`).join(" · ");
    return `<div class="part"><span>${p.n}</span><div class="stack">${tot?CATS.filter(c=>p.c[c.id]).map(c=>`<b style="--cc:var(--c-${c.id});width:${p.c[c.id]/tot*100}%" title="${c.n} ${p.c[c.id]}h"></b>`).join(""):""}</div><div class="top3">${top||"无记录"}</div></div>`}).join("")}</div></div>
  <div class="card"><h3><span>时间都去哪了 <small>${filled} 小时已记录</small></span></h3><div class="bars">${CATS.filter(c=>cnt[c.id]).sort((a,b)=>cnt[b.id]-cnt[a.id]).map(c=>`<div class="bar" style="--cc:var(--c-${c.id})"><span>${c.n}</span><div class="t"><b style="width:${cnt[c.id]/max*100}%"></b></div><span class="n">${cnt[c.id]} h</span></div>`).join("")}</div></div>`}
function formStats(form,ks,src,today){const list=form==="zeng"?ZENG:C50;const live=ks.filter(k=>k<=today||state.demo);
  const per=list.map(it=>{let d=0,h=0;live.forEach(k=>{const s=statusOf(form,it.id,k,src);if(s.ok)d++;h+=s.h||0});return{it,d,h,rate:live.length?d/live.length:0}});
  const scores=live.map(k=>({k,s:scoreOf(form,k,src)}));return{list,live,per,scores}}
function sumZeng(ks,src,el,today){
  const{per,scores,live}=formStats("zeng",ks,src,today);const full=scores.filter(s=>s.s===8).length;const avg=scores.length?scores.reduce((a,b)=>a+b.s,0)/scores.length:0;
  const best=[...per].sort((a,b)=>b.rate-a.rate)[0],worst=[...per].sort((a,b)=>a.rate-b.rate)[0];const bk=buckets(ks);const yr=state.sumMode==="year";
  const cols=bk.map(b=>b.label);
  const rows=ZENG.map(it=>({n:it.n,cc:it.cat,vals:bk.map(b=>{const l=b.keys.filter(k=>k<=today||state.demo);return l.length?l.filter(k=>statusOf("zeng",it.id,k,src).ok).length/l.length:null})}));
  const pts=bk.map(b=>{const l=b.keys.filter(k=>k<=today||state.demo);const t=l.reduce((a,k)=>a+scoreOf("zeng",k,src),0);return{label:b.label,v:l.length?+(t/l.length).toFixed(1):0}});
  return `<div class="kpis">
   ${kpi("平均每天",`${avg.toFixed(1)}<small> / 8</small>`,`${live.length} 天`)}
   ${kpi("八格全满",`${full}<small> 天</small>`,"八项都完成")}
   ${kpi("最稳的一格",best.it.n,`完成 ${best.d} 天`)}
   ${kpi("最常缺的一格",worst.it.n,`完成 ${worst.d} 天`)}</div>
  <div class="card"><h3><span>每格完成情况 <small>完成天数 · 累计小时</small></span></h3><div class="bars">${per.map(p=>`<div class="bar" style="--cc:var(--c-${p.it.cat})"><span>${p.it.n}<small style="color:var(--muted)"> ${p.it.d}</small></span><div class="t"><b style="width:${p.rate*100}%"></b></div><span class="n">${p.d}天 · ${p.h}h</span></div>`).join("")}</div></div>
  <div class="card"><h3><span>八格日历 <small>${yr?"每月完成率":"颜色越深越完成"}</small></span></h3>${matrix(rows,cols)}</div>
  <div class="card"><h3><span>每天完成几格 <small>${yr?"每月平均":"满分 8"}</small></span></h3>${barChart(pts,{color:"var(--accent)",fmt:v=>v,aria:"每天完成格数",max:8})}</div>`}
function sumC50(ks,src,el,today){
  const{per,scores,live}=formStats("c50",ks,src,today);const full=scores.filter(s=>s.s===7).length;const avg=scores.length?scores.reduce((a,b)=>a+b.s,0)/scores.length:0;
  const worst=[...per].sort((a,b)=>a.rate-b.rate)[0];const bk=buckets(ks);const yr=state.sumMode==="year";
  /* challenge progress, independent of period */
  let prog="";
  if(state.c50Start){const t=logicalNow().date;const cur=Math.min(50,Math.max(0,dayDiff(state.c50Start,t)+1));let streak=0,doneFull=0;
    const sq=[...Array(50)].map((_,i)=>{const k=key(addDays(parse(state.c50Start),i));if(k>t)return `<i title="第${i+1}天"></i>`;const s=scoreOf("c50",k,src);if(s===7)doneFull++;return `<i class="p ${k===t?"cur":""}" style="background:color-mix(in srgb,var(--ok) ${Math.round(s/7*100)}%,var(--bg))" title="第${i+1}天 ${md(k)} ${s}/7"></i>`}).join("");
    let d=t;if(scoreOf("c50",d,src)<7)d=key(addDays(parse(d),-1));while(d>=state.c50Start&&scoreOf("c50",d,src)===7){streak++;d=key(addDays(parse(d),-1))}
    prog=`<div class="card"><h3><span>挑战进度 <small>${md(state.c50Start)} 开始</small></span><span class="score">第 ${cur} / 50 天</span></h3><div class="prog">${sq}</div>
      <div class="row" style="justify-content:space-between;margin-top:10px"><span class="note">全部完成 ${doneFull} 天 · 当前连续 ${streak} 天</span><span class="row" style="gap:6px"><input class="field" type="date" id="c50s" value="${state.c50Start}" style="width:auto;font-size:13px;padding:5px 8px"></span></div></div>`}
  else prog=`<div class="card"><h3><span>挑战进度</span></h3><div class="row"><span class="note">设定开始日期：</span><input class="field" type="date" id="c50s" style="width:auto;font-size:13px;padding:5px 8px"></div></div>`;
  const rows=C50.map(it=>({n:it.n.replace(" 1 小时","").replace(" 10 页",""),cc:it.cc==="other"?"study":it.cc,vals:bk.map(b=>{const l=b.keys.filter(k=>k<=today||state.demo);return l.length?l.filter(k=>statusOf("c50",it.id,k,src).ok).length/l.length:null})}));
  const pts=bk.map(b=>{const l=b.keys.filter(k=>k<=today||state.demo);const t=l.reduce((a,k)=>a+scoreOf("c50",k,src),0);return{label:b.label,v:l.length?+(t/l.length).toFixed(1):0}});
  return `${prog}<div class="kpis">
   ${kpi("平均每天",`${avg.toFixed(1)}<small> / 7</small>`,`${live.length} 天`)}
   ${kpi("全部完成",`${full}<small> 天</small>`,"七项都打勾")}
   ${kpi("最常缺",worst.it.n,`完成 ${worst.d} / ${live.length} 天`)}
   ${kpi("早起达标",`${per[0].d}<small> 天</small>`,"8:30 前起床")}</div>
  <div class="card"><h3><span>每项完成率</span></h3><div class="bars">${per.map(p=>`<div class="bar" style="--cc:var(--c-${p.it.cc})"><span>${p.it.n.replace(" 1 小时","").replace(" 10 页","")}</span><div class="t"><b style="width:${p.rate*100}%"></b></div><span class="n">${Math.round(p.rate*100)}% · ${p.d}天</span></div>`).join("")}</div></div>
  <div class="card"><h3><span>打卡日历 <small>${yr?"每月完成率":"颜色越深越完成"}</small></span></h3>${matrix(rows,bk.map(b=>b.label))}</div>
  <div class="card"><h3><span>每天完成几项 <small>${yr?"每月平均":"满分 7"}</small></span></h3>${barChart(pts,{color:"var(--ok)",fmt:v=>v,aria:"每天完成项数",max:7})}</div>`}
function openSettings(){
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-label="GitHub 同步">
   <div><h2>GitHub 同步</h2><div class="sub">${GH.owner}/${GH.repo} · ${ghToken?"这台设备已连接":"这台设备还没连接"}</div></div>
   <div class="note">粘贴一个只对 ${GH.repo} 有 Contents 读写权限的 token。它只存在这台设备的浏览器里，每台设备粘贴一次。</div>
   <input class="field" id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
   <div class="actions">${ghToken?'<button id="tokDel">断开</button>':""}<button id="cancel">取消</button><button class="primary" id="tokBtn">保存</button></div></div>`;
  $("#scrim").onclick=closeSheet;$("#cancel").onclick=closeSheet;
  $("#tokBtn").onclick=()=>{const v=$("#tok").value.trim();if(!v)return;ghToken=v;try{localStorage.setItem(TK,v)}catch(e){}closeSheet();ghSync()};
  const td=$("#tokDel");if(td)td.onclick=()=>{ghToken=null;try{localStorage.removeItem(TK)}catch(e){}setSync("仅存本机 · 未连接 GitHub");closeSheet()};
}
function bindSum(){
  $("#main").querySelectorAll("[data-form]").forEach(b=>b.onclick=()=>{state.sumForm=b.dataset.form;render()});
  $("#main").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.sumMode=b.dataset.mode;render()});
  const on=$("#demoOn");if(on)on.onclick=()=>{state.demo=true;render()};const off=$("#demoOff");if(off)off.onclick=()=>{state.demo=false;render()};
  const cs=$("#c50s");if(cs)cs.onchange=()=>{if(cs.value){state.c50Start=cs.value;saveSettings();render()}};
}

/* ---------- shell ---------- */
function render(){
  $("#tabLog").setAttribute("aria-selected",state.view==="log");$("#tabChk").setAttribute("aria-selected",state.view==="check");$("#tabSum").setAttribute("aria-selected",state.view==="sum");
  if(state.view==="log")renderLog();else if(state.view==="check")renderCheck();else renderSum();
}
$("#tabLog").onclick=()=>{state.view="log";render()};
$("#tabChk").onclick=()=>{state.view="check";state.checkDate=state.checkDate||logicalNow().date;render()};
$("#tabSum").onclick=()=>{state.view="sum";render()};
$("#sync").onclick=openSettings;
$("#prev").onclick=()=>shift(-1);$("#next").onclick=()=>shift(1);
$("#todayBtn").onclick=()=>{const t=logicalNow().date;state.weekStart=currentWeekStart();state.sumRef=t;state.checkDate=t;renderLog.scrolled=false;render()};
function shift(dir){
  if(state.view==="log")state.weekStart=key(addDays(parse(state.weekStart),7*dir));
  else if(state.view==="check")state.checkDate=key(addDays(parse(state.checkDate),dir));
  else if(state.sumMode==="week")state.sumRef=key(addDays(parse(currentWeekStart(state.sumRef)),7*dir));
  else if(state.sumMode==="month"){const r=parse(state.sumRef);state.sumRef=key(new Date(r.getFullYear(),r.getMonth()+dir,1))}
  else{const r=parse(state.sumRef);state.sumRef=key(new Date(r.getFullYear()+dir,0,1))}
  render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;scheduleSync(300);if(!sheetOpen()&&!editing())render()});
window.addEventListener("online",()=>scheduleSync(300));
setInterval(()=>{if(!sheetOpen()&&state.view==="log")renderLog()},60000);

lsLoad();
if(!state.anchor){state.anchor=logicalNow().date;lsSave()}
state.weekStart=currentWeekStart();state.sumRef=logicalNow().date;state.checkDate=logicalNow().date;
render();
ghSync();
})();
</script>
</body></html>
